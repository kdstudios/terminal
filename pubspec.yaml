name: wasteland_terminal
description: Dual-terminal wasteland survival RPG.
publish_to: 'none'
version: 0.7.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: any
  audioplayers: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/atlas/
    - assets/ui/
